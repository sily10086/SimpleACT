<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#62748b"/></marker></defs><rect width="1440" height="960" fill="#f5f7fb"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="60" font-size="34" fill="#19324b" font-weight="700">战斗框架：一份权威逻辑，多种内容与表现</text><text x="60" y="96" font-size="20" fill="#52677d" font-weight="400">设计示意 · 数据负责内容，World负责顺序，表现读取结果</text><rect x="60" y="130" width="400" height="115" rx="16" fill="#e9f4ff" stroke="#d6e0ec" stroke-width="2"/><text x="80" y="166" font-size="24" fill="#19324b" font-weight="600">玩家输入</text><text x="80" y="199" font-size="19" fill="#52677d" font-weight="400">设备 / 绑定 → 语义原语</text><rect x="520" y="130" width="400" height="115" rx="16" fill="#e9f4ff" stroke="#d6e0ec" stroke-width="2"/><text x="540" y="166" font-size="24" fill="#19324b" font-weight="600">怪物 AI</text><text x="540" y="199" font-size="19" fill="#52677d" font-weight="400">感知 / 决策 → 同一意图入口</text><rect x="980" y="130" width="400" height="115" rx="16" fill="#fff3dd" stroke="#d6e0ec" stroke-width="2"/><text x="1000" y="166" font-size="24" fill="#19324b" font-weight="600">策划内容</text><text x="1000" y="199" font-size="19" fill="#52677d" font-weight="400">动作 / 窗口 / 图 / 规则快照</text><path d="M260,245 L260,315" fill="none" stroke="#62748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M720,245 L720,315" fill="none" stroke="#62748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M1180,245 L1180,315" fill="none" stroke="#62748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="290" width="1320" height="220" rx="20" fill="#eaf1fb" stroke="#b9cde6" stroke-width="2"/><text x="85" y="326" font-size="24" fill="#254f7b" font-weight="600">BattleWorld · 唯一 Tick 驱动与单位数据所有者</text><rect x="90" y="350" width="280" height="125" rx="16" fill="#ffffff" stroke="#d6e0ec" stroke-width="2"/><text x="110" y="386" font-size="24" fill="#19324b" font-weight="600">UnitFSM</text><text x="110" y="419" font-size="19" fill="#52677d" font-weight="400">能做什么</text><text x="110" y="448" font-size="19" fill="#52677d" font-weight="400">许可 / 迁移 / 打断</text><rect x="410" y="350" width="280" height="125" rx="16" fill="#ffffff" stroke="#d6e0ec" stroke-width="2"/><text x="430" y="386" font-size="24" fill="#19324b" font-weight="600">ActionGraph</text><text x="430" y="419" font-size="19" fill="#52677d" font-weight="400">接哪一招</text><text x="430" y="448" font-size="19" fill="#52677d" font-weight="400">条件 / 取消 / 派生</text><rect x="730" y="350" width="280" height="125" rx="16" fill="#ffffff" stroke="#d6e0ec" stroke-width="2"/><text x="750" y="386" font-size="24" fill="#19324b" font-weight="600">ActionTimeline</text><text x="750" y="419" font-size="19" fill="#52677d" font-weight="400">何时生效</text><text x="750" y="448" font-size="19" fill="#52677d" font-weight="400">帧 / 窗口 / 命令</text><rect x="1050" y="350" width="300" height="125" rx="16" fill="#ffffff" stroke="#d6e0ec" stroke-width="2"/><text x="1070" y="386" font-size="24" fill="#19324b" font-weight="600">Motor</text><text x="1070" y="419" font-size="19" fill="#52677d" font-weight="400">如何移动</text><text x="1070" y="448" font-size="19" fill="#52677d" font-weight="400">位移仲裁 / 查询</text><path d="M370,410 L410,410" fill="none" stroke="#62748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M690,410 L730,410" fill="none" stroke="#62748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M1010,410 L1050,410" fill="none" stroke="#62748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M720,510 L720,565" fill="none" stroke="#62748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="565" width="400" height="135" rx="16" fill="#ffffff" stroke="#d6e0ec" stroke-width="2"/><text x="80" y="601" font-size="24" fill="#19324b" font-weight="600">收集碰撞候选</text><text x="80" y="634" font-size="19" fill="#52677d" font-weight="400">Hitbox × Hurtbox</text><text x="80" y="663" font-size="19" fill="#52677d" font-weight="400">扫掠 / 阵营 / 去重</text><rect x="520" y="565" width="400" height="135" rx="16" fill="#e9f7f0" stroke="#d6e0ec" stroke-width="2"/><text x="540" y="601" font-size="24" fill="#19324b" font-weight="600">提交战斗结果</text><text x="540" y="634" font-size="19" fill="#52677d" font-weight="400">伤害 / Buff / 削韧 / 部位</text><text x="540" y="663" font-size="19" fill="#52677d" font-weight="400">再提交受击或死亡迁移</text><rect x="980" y="565" width="400" height="135" rx="16" fill="#e9f7f0" stroke="#d6e0ec" stroke-width="2"/><text x="1000" y="601" font-size="24" fill="#19324b" font-weight="600">已提交事件与快照</text><text x="1000" y="634" font-size="19" fill="#52677d" font-weight="400">不可变事实 / 稳定身份</text><text x="1000" y="663" font-size="19" fill="#52677d" font-weight="400">取消不撤销已经发生的伤害</text><path d="M460,630 L520,630" fill="none" stroke="#62748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M920,630 L980,630" fill="none" stroke="#62748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M1180,700 L1180,760" fill="none" stroke="#62748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="760" width="840" height="120" rx="16" fill="#eef0f5" stroke="#d6e0ec" stroke-width="2"/><text x="80" y="796" font-size="24" fill="#19324b" font-weight="600">TEngine 基础设施</text><text x="80" y="829" font-size="19" fill="#52677d" font-weight="400">复用资源、对象池、GameEvent、UI、音频与热更边界</text><rect x="980" y="760" width="400" height="120" rx="16" fill="#f2eafb" stroke="#d6e0ec" stroke-width="2"/><text x="1000" y="796" font-size="24" fill="#19324b" font-weight="600">表现适配层</text><text x="1000" y="829" font-size="19" fill="#52677d" font-weight="400">Sprite / Playables / Spine</text><text x="1000" y="858" font-size="19" fill="#52677d" font-weight="400">音效 / VFX / UI</text><text x="60" y="928" font-size="23" fill="#52677d" font-weight="400">状态是权威，动画是投影；后端可以不同，战斗结算只有一份。</text></g></svg>
