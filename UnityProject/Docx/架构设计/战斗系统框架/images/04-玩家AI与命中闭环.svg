<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#62748b"/></marker></defs><rect width="1440" height="940" fill="#f5f7fb"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="60" font-size="34" fill="#19324b" font-weight="700">玩家与 AI：不同生产者，共享战斗执行链</text><text x="60" y="96" font-size="20" fill="#52677d" font-weight="400">共享规则与执行机制；输入时序、AI节奏、动作数据仍可分别配置</text><rect x="150" y="135" width="480" height="120" rx="16" fill="#e9f4ff" stroke="#d6e0ec" stroke-width="2"/><text x="170" y="171" font-size="24" fill="#19324b" font-weight="600">玩家</text><text x="170" y="204" font-size="19" fill="#52677d" font-weight="400">按键 → BindingProfile → Attack原语</text><rect x="810" y="135" width="480" height="120" rx="16" fill="#fff3dd" stroke="#d6e0ec" stroke-width="2"/><text x="830" y="171" font-size="24" fill="#19324b" font-weight="600">怪物 AI</text><text x="830" y="204" font-size="19" fill="#52677d" font-weight="400">感知 → 决策任务 → Attack原语</text><path d="M390,255 L570,310" fill="none" stroke="#62748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M1050,255 L870,310" fill="none" stroke="#62748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="340" y="310" width="760" height="110" rx="16" fill="#ffffff" stroke="#d6e0ec" stroke-width="2"/><text x="360" y="346" font-size="24" fill="#19324b" font-weight="600">统一入口：语境解析 + UnitFSM许可</text><text x="360" y="379" font-size="19" fill="#52677d" font-weight="400">同一原语与语境得到同一语义；禁止态返回拒绝原因</text><path d="M720,420 L720,465" fill="none" stroke="#62748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="340" y="465" width="760" height="110" rx="16" fill="#eaf1fb" stroke="#d6e0ec" stroke-width="2"/><text x="360" y="501" font-size="24" fill="#19324b" font-weight="600">ActionGraph → ActionTimeline</text><text x="360" y="534" font-size="19" fill="#52677d" font-weight="400">选择招式，提交一次动作，按局部帧执行窗口与命令</text><path d="M720,575 L720,620" fill="none" stroke="#62748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="340" y="620" width="760" height="110" rx="16" fill="#e9f7f0" stroke="#d6e0ec" stroke-width="2"/><text x="360" y="656" font-size="24" fill="#19324b" font-weight="600">HitResolver → EffectSystem → 反应迁移</text><text x="360" y="689" font-size="19" fill="#52677d" font-weight="400">统一命中、去重、伤害、取消、死亡；不靠动画回调扣血</text><path d="M520,730 L300,785" fill="none" stroke="#62748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M920,730 L1140,785" fill="none" stroke="#62748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="785" width="600" height="105" rx="16" fill="#f2eafb" stroke="#d6e0ec" stroke-width="2"/><text x="80" y="821" font-size="24" fill="#19324b" font-weight="600">结果与表现</text><text x="80" y="854" font-size="19" fill="#52677d" font-weight="400">动画 / 音效 / 特效 / UI读取已提交事实</text><rect x="780" y="785" width="600" height="105" rx="16" fill="#ffffff" stroke="#d6e0ec" stroke-width="2"/><text x="800" y="821" font-size="24" fill="#19324b" font-weight="600">动作回执</text><text x="800" y="854" font-size="19" fill="#52677d" font-weight="400">AI等待完成或取消，避免每次决策重复发招</text></g></svg>
