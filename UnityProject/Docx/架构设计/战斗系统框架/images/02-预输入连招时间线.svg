<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#62748b"/></marker></defs><rect width="1440" height="860" fill="#f5f7fb"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="60" font-size="34" fill="#19324b" font-weight="700">预输入连招：输入先到，窗口开启才提交</text><text x="60" y="96" font-size="20" fill="#52677d" font-weight="400">自拟案例 · A从T100开始；第二次输入T110；T114接入B；窗口采用左闭右开</text><line x1="220" y1="155" x2="220" y2="570" stroke="#d2dce8" stroke-width="2"/><text x="196" y="145" font-size="18" fill="#19324b" font-weight="400">T100</text><line x1="448" y1="155" x2="448" y2="570" stroke="#d2dce8" stroke-width="2"/><text x="424" y="145" font-size="18" fill="#19324b" font-weight="400">T106</text><line x1="600" y1="155" x2="600" y2="570" stroke="#d2dce8" stroke-width="2"/><text x="576" y="145" font-size="18" fill="#19324b" font-weight="400">T110</text><line x1="752" y1="155" x2="752" y2="570" stroke="#d2dce8" stroke-width="2"/><text x="728" y="145" font-size="18" fill="#19324b" font-weight="400">T114</text><line x1="942" y1="155" x2="942" y2="570" stroke="#d2dce8" stroke-width="2"/><text x="918" y="145" font-size="18" fill="#19324b" font-weight="400">T119</text><line x1="1056" y1="155" x2="1056" y2="570" stroke="#d2dce8" stroke-width="2"/><text x="1032" y="145" font-size="18" fill="#19324b" font-weight="400">T122</text><line x1="1132" y1="155" x2="1132" y2="570" stroke="#d2dce8" stroke-width="2"/><text x="1108" y="145" font-size="18" fill="#19324b" font-weight="400">T124</text><text x="60" y="226" font-size="24" fill="#19324b" font-weight="600">攻击 A</text><rect x="220" y="185" width="532" height="64" rx="10" fill="#4c85ce"/><text x="234" y="225" font-size="22" fill="white" font-weight="400">前摇 → 命中 → 后摇</text><rect x="752" y="185" width="380" height="64" rx="10" fill="#e3eaf3" stroke="#8ca3bd" stroke-dasharray="7 5"/><text x="766" y="225" font-size="20" fill="#19324b" font-weight="400">取消后不再播放</text><text x="60" y="326" font-size="24" fill="#19324b" font-weight="600">命中窗口</text><rect x="448" y="285" width="152" height="64" rx="10" fill="#ee9b49"/><text x="460" y="325" font-size="20" fill="white" font-weight="400">A.f6–9</text><text x="60" y="426" font-size="24" fill="#19324b" font-weight="600">输入缓冲</text><rect x="600" y="385" width="342" height="64" rx="10" fill="#89c4ad"/><text x="612" y="425" font-size="20" fill="#153f32" font-weight="400">T110进入 / T119过期</text><text x="60" y="526" font-size="24" fill="#19324b" font-weight="600">攻击 B</text><rect x="752" y="485" width="400" height="64" rx="10" fill="#8673c4"/><text x="766" y="525" font-size="20" fill="white" font-weight="400">T114进入f0 → T122命中</text><rect x="60" y="615" width="620" height="140" rx="16" fill="#ffffff" stroke="#d6e0ec" stroke-width="2"/><text x="80" y="651" font-size="24" fill="#19324b" font-weight="600">T114发生一次完整提交</text><text x="80" y="684" font-size="19" fill="#52677d" font-weight="400">取消窗口已开 + 输入未过期 + 资源足够</text><text x="80" y="713" font-size="19" fill="#52677d" font-weight="400">消费命令2，扣15耐力，分配新的ActionInstance</text><rect x="720" y="615" width="660" height="140" rx="16" fill="#e9f7f0" stroke="#d6e0ec" stroke-width="2"/><text x="740" y="651" font-size="24" fill="#19324b" font-weight="600">为什么敌人不会被一刀重复伤害</text><text x="740" y="684" font-size="19" fill="#52677d" font-weight="400">A的f6–9共用同一命中账本；B是新攻击实例</text><text x="740" y="713" font-size="19" fill="#52677d" font-weight="400">敌人HP：120 → A命中80 → B命中20</text><text x="60" y="812" font-size="22" fill="#52677d" font-weight="400">若输入在T105，expireTick=114：到窗口开启时已失效，不能连招。</text></g></svg>
