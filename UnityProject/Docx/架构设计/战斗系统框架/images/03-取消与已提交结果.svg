<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#62748b"/></marker></defs><rect width="1440" height="860" fill="#f5f7fb"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="60" font-size="34" fill="#19324b" font-weight="700">动作取消：只废弃未执行的旧命令</text><text x="60" y="96" font-size="20" fill="#52677d" font-weight="400">逻辑同帧生效；视觉可混合；已经提交的伤害事实必须保留</text><rect x="60" y="145" width="400" height="120" rx="16" fill="#e9f4ff" stroke="#d6e0ec" stroke-width="2"/><text x="80" y="181" font-size="24" fill="#19324b" font-weight="600">A 在 T100 开始</text><text x="80" y="214" font-size="19" fill="#52677d" font-weight="400">创建 ActionInstance / Epoch</text><text x="80" y="243" font-size="19" fill="#52677d" font-weight="400">扣10耐力</text><path d="M460,205 L520,205" fill="none" stroke="#62748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="520" y="145" width="400" height="120" rx="16" fill="#fff3dd" stroke="#d6e0ec" stroke-width="2"/><text x="540" y="181" font-size="24" fill="#19324b" font-weight="600">情形一：T105 缴械</text><text x="540" y="214" font-size="19" fill="#52677d" font-weight="400">发生在 f6 命中之前</text><text x="540" y="243" font-size="19" fill="#52677d" font-weight="400">取消当前武器动作</text><path d="M920,205 L980,205" fill="none" stroke="#62748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="980" y="145" width="400" height="120" rx="16" fill="#e9f7f0" stroke="#d6e0ec" stroke-width="2"/><text x="1000" y="181" font-size="24" fill="#19324b" font-weight="600">T106 不再命中</text><text x="1000" y="214" font-size="19" fill="#52677d" font-weight="400">旧命令失效 / 框体关闭</text><text x="1000" y="243" font-size="19" fill="#52677d" font-weight="400">不能补发被跳过的命中</text><rect x="60" y="335" width="400" height="120" rx="16" fill="#e9f4ff" stroke="#d6e0ec" stroke-width="2"/><text x="80" y="371" font-size="24" fill="#19324b" font-weight="600">A 在 T106 已命中</text><text x="80" y="404" font-size="19" fill="#52677d" font-weight="400">40伤害已提交</text><text x="80" y="433" font-size="19" fill="#52677d" font-weight="400">结果具备稳定 ResultId</text><path d="M460,395 L520,395" fill="none" stroke="#62748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="520" y="335" width="400" height="120" rx="16" fill="#fff3dd" stroke="#d6e0ec" stroke-width="2"/><text x="540" y="371" font-size="24" fill="#19324b" font-weight="600">情形二：T108 缴械</text><text x="540" y="404" font-size="19" fill="#52677d" font-weight="400">停止动作后续执行</text><text x="540" y="433" font-size="19" fill="#52677d" font-weight="400">不撤销已经发生的命中</text><path d="M920,395 L980,395" fill="none" stroke="#62748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="980" y="335" width="400" height="120" rx="16" fill="#e9f7f0" stroke="#d6e0ec" stroke-width="2"/><text x="1000" y="371" font-size="24" fill="#19324b" font-weight="600">保留伤害事实</text><text x="1000" y="404" font-size="19" fill="#52677d" font-weight="400">HP不回滚 / UI仍可显示</text><text x="1000" y="433" font-size="19" fill="#52677d" font-weight="400">只取消未来动作命令</text><rect x="60" y="535" width="620" height="195" rx="16" fill="#ffffff" stroke="#d6e0ec" stroke-width="2"/><text x="80" y="571" font-size="24" fill="#19324b" font-weight="600">取消必须清理</text><text x="80" y="604" font-size="19" fill="#52677d" font-weight="400">旧动作攻击框与临时窗口</text><text x="80" y="633" font-size="19" fill="#52677d" font-weight="400">旧epoch预输入、未执行逻辑命令</text><text x="80" y="662" font-size="19" fill="#52677d" font-weight="400">动作占用、持续尾迹和任务回执</text><rect x="720" y="535" width="660" height="195" rx="16" fill="#ffffff" stroke="#d6e0ec" stroke-width="2"/><text x="740" y="571" font-size="24" fill="#19324b" font-weight="600">取消不能误删</text><text x="740" y="604" font-size="19" fill="#52677d" font-weight="400">已提交DamageApplied / PartBroken / UnitDied</text><text x="740" y="633" font-size="19" fill="#52677d" font-weight="400">独立生存的已发射弹丸（按配置）</text><text x="740" y="662" font-size="19" fill="#52677d" font-weight="400">其他单位、其他动作的事件</text><text x="60" y="804" font-size="23" fill="#52677d" font-weight="400">不要 Clear 整个事件中心；用 owner + actionInstance + epoch 定位失效数据。</text></g></svg>
